<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Marvelous Oghenetejiri Agbroko — Frontend Developer crafting interfaces that feel inevitable." />
    <title>Marvelous Agbroko | Frontend Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('mousemove', (e) => {
        const c = document.getElementById('cursor');
        const r = document.getElementById('cursor-ring');
        if (c) { c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px'; }
        if (r) { setTimeout(() => { r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; }, 80); }
      });
    </script>
  </body>
</html>
